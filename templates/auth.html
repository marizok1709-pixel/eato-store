{% extends "base.html" %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-container-wide">
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Вход</button>
                <button class="auth-tab" data-tab="register">Регистрация</button>
            </div>

            <!-- Форма входа -->
            <form id="loginForm" class="auth-form active" method="POST" action="{{ url_for('auth') }}">
                <input type="hidden" name="action" value="login">

                <div class="form-group">
                    <label>Email или телефон</label>
                    <input type="text" name="login_input" required placeholder="example@mail.com или +79991234567">
                </div>

                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" required placeholder="Введите пароль">
                </div>

                <button type="submit" class="btn btn-primary btn-large">Войти</button>

                <div class="auth-switch">
                    <p>Нет аккаунта?</p>
                    <button type="button" class="switch-tab" data-tab="register">Зарегистрироваться</button>
                </div>
            </form>

            <!-- Форма регистрации -->
            <form id="registerForm" class="auth-form" method="POST" action="{{ url_for('auth') }}">
                <input type="hidden" name="action" value="register">

                <div class="form-row">
                    <div class="form-group">
                        <label>Имя (2-50 символов)</label>
                        <input type="text" name="name" required minlength="2" maxlength="50" placeholder="Ваше имя">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" required placeholder="example@mail.com">
                    </div>
                </div>

                <div class="form-group">
                    <label>Телефон</label>
                    <input type="tel" name="phone" required placeholder="+79991234567" pattern="[+0-9\s\-\(\)]{10,}">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Пароль (минимум 6 символов)</label>
                        <input type="password" name="password" required minlength="6" placeholder="Придумайте пароль">
                    </div>

                    <div class="form-group">
                        <label>Подтвердите пароль</label>
                        <input type="password" name="password_confirm" required minlength="6" placeholder="Повторите пароль">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-large">Зарегистрироваться</button>

                <div class="auth-switch">
                    <p>Уже есть аккаунт?</p>
                    <button type="button" class="switch-tab" data-tab="login">Войти</button>
                </div>
            </form>

            <!-- Flash сообщения -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                <div class="flash-message {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}
        </div>
    </div>
</section>

<style>
.auth-section {
    padding-top: 150px;
    min-height: 100vh;
    display: flex;
    align-items: center;
}

.auth-container-wide {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    background: var(--dark-gray);
    padding: 60px 80px;
    border: 1px solid var(--medium-gray);
}

.auth-tabs {
    display: flex;
    gap: 20px;
    margin-bottom: 40px;
    border-bottom: 2px solid var(--medium-gray);
}

.auth-tab {
    flex: 1;
    padding: 15px;
    background: none;
    border: none;
    color: var(--light-gray);
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
}

.auth-tab.active {
    color: var(--white);
}

.auth-tab.active::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 100%;
    height: 2px;
    background: var(--white);
}

.auth-tab:hover {
    color: var(--white);
}

.auth-form {
    display: none;
}

.auth-form.active {
    display: block;
    animation: fadeIn 0.3s ease;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
}

.form-group {
    margin-bottom: 25px;
}

.form-group label {
    display: block;
    margin-bottom: 10px;
    color: var(--light-gray);
}

.form-group input {
    width: 100%;
    padding: 15px;
    background: var(--medium-gray);
    border: 1px solid var(--medium-gray);
    color: var(--white);
    transition: all 0.3s ease;
}

.form-group input:focus {
    outline: none;
    border-color: var(--white);
    background: var(--dark-gray);
}

.btn-large {
    display: block;
    width: 100%;
    text-align: center;
    margin-top: 20px;
}

.auth-switch {
    margin-top: 30px;
    text-align: center;
    color: var(--light-gray);
}

.auth-switch p {
    margin-bottom: 10px;
}

.switch-tab {
    background: none;
    border: none;
    color: var(--white);
    text-decoration: underline;
    cursor: pointer;
    transition: color 0.3s ease;
}

.switch-tab:hover {
    color: var(--light-gray);
}

.flash-messages {
    margin-top: 30px;
}

.flash-message {
    padding: 15px;
    margin-bottom: 10px;
    border-left: 4px solid;
}

.flash-message.error {
    background: rgba(255, 0, 0, 0.1);
    border-color: #ff3333;
    color: #ff6666;
}

.flash-message.success {
    background: rgba(0, 255, 0, 0.1);
    border-color: #33ff33;
    color: #66ff66;
}

.user-menu {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-right: 20px;
}

.user-name {
    color: var(--white);
}

.logout-link {
    color: var(--light-gray);
    text-decoration: none;
    transition: color 0.3s ease;
}

.logout-link:hover {
    color: var(--white);
}

.auth-btn {
    color: var(--white);
    text-decoration: none;
    margin-right: 20px;
    transition: color 0.3s ease;
}

.auth-btn:hover {
    color: var(--light-gray);
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 768px) {
    .auth-container-wide {
        padding: 40px 30px;
    }

    .form-row {
        grid-template-columns: 1fr;
        gap: 0;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const tabs = document.querySelectorAll('.auth-tab');
    const forms = document.querySelectorAll('.auth-form');
    const switchTabs = document.querySelectorAll('.switch-tab');

    function switchToTab(tabName) {
        tabs.forEach(tab => {
            if (tab.dataset.tab === tabName) {
                tab.classList.add('active');
            } else {
                tab.classList.remove('active');
            }
        });

        forms.forEach(form => {
            if (form.id === tabName + 'Form') {
                form.classList.add('active');
            } else {
                form.classList.remove('active');
            }
        });
    }

    tabs.forEach(tab => {
        tab.addEventListener('click', function() {
            switchToTab(this.dataset.tab);
        });
    });

    switchTabs.forEach(btn => {
        btn.addEventListener('click', function() {
            switchToTab(this.dataset.tab);
        });
    });
});
</script>
{% endblock %}
