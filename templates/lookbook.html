{% extends "base.html" %}

{% block content %}
<section class="lookbook-section">
    <div class="container">
        <h1 class="page-title"><em>Лукбук</em></h1>

        {% if images %}
        <div class="lookbook-grid">
            {% for image in images %}
            <div class="lookbook-item">
                <img src="{{ url_for('static', filename='images/lookbook/' + image) }}"
                     alt="Lookbook {{ loop.index }}"
                     loading="lazy"
                     onerror="this.parentElement.style.display='none'">
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div class="empty-lookbook">
            <p>Фотографии лукбука пока не добавлены</p>
            <p class="hint">Добавьте изображения в папку <code>static/images/lookbook/</code></p>
        </div>
        {% endif %}
    </div>
</section>

<style>
.lookbook-section {
    padding-top: 150px;
    padding-bottom: 100px;
    min-height: 100vh;
}

.lookbook-grid {
    columns: 3 300px;
    column-gap: 20px;
}

.lookbook-item {
    overflow: hidden;
    position: relative;
    break-inside: avoid;
    margin-bottom: 20px;
}

.lookbook-item img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.5s ease, filter 0.3s ease;
}

.lookbook-item:hover img {
    transform: scale(1.05);
    filter: brightness(1.1);
}

.empty-lookbook {
    text-align: center;
    padding: 100px;
    color: var(--light-gray);
}

.empty-lookbook .hint {
    margin-top: 20px;
    opacity: 0.7;
}

.empty-lookbook code {
    background: var(--medium-gray);
    padding: 5px 10px;
    border-radius: 3px;
}

/* Адаптивность */
@media (max-width: 968px) {
    .lookbook-grid {
        columns: 2 250px;
    }
}

@media (max-width: 768px) {
    .lookbook-grid {
        columns: 1;
    }
}
</style>
{% endblock %}
